<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido do curso</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7fb;--ink:#231a26;--muted:#6f6474;--plum:#4a1d4e;--orchid:#b4488d;--line:#e6dce8;--card:#fff;--ok:#1f7a4d;--err:#b3261e;--hover:#fdf5fc}
@media (prefers-color-scheme:dark){:root{--bg:#1b141e;--ink:#f3ecf5;--muted:#a99bb0;--plum:#e8c9ec;--orchid:#d878b5;--line:#3a2d3f;--card:#251b29;--ok:#6fd3a0;--err:#ff8a80;--hover:#2e2233}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;padding-bottom:140px}
header{padding:28px 20px 12px;max-width:720px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.6rem;color:var(--plum)}
.who{margin:0;color:var(--muted)}
main{max-width:720px;margin:0 auto;padding:0 20px}
button:focus-visible,input:focus-visible{outline:3px solid var(--orchid);outline-offset:2px}

.sticky-header{position:sticky;top:0;background:var(--bg);z-index:100;padding:10px 20px 15px;margin:0 -20px;border-bottom:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.03)}
.sticky-header h2{font-size:1.1rem;margin:12px 0 8px;color:var(--plum)}
.sticky-header .search-box{margin-top:6px}

.grid-opcoes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card-opcao{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 12px;text-align:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.03);transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card-opcao:hover,.card-opcao:active{border-color:var(--orchid);background:var(--hover)}
.card-titulo{font-weight:700;font-size:1rem;color:var(--plum);line-height:1.3}
.badge{background:var(--orchid);color:#fff;font-size:.75rem;font-weight:700;border-radius:20px;padding:3px 10px}

.btn-voltar{background:transparent;border:1px solid var(--plum);color:var(--plum);padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer;font-size:.9rem}
.search-box{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;color:var(--ink);font-size:1rem}
.categoria-bloco{margin-top:24px}
.categoria-titulo{font-size:1.1rem;margin-bottom:12px;color:var(--plum);border-bottom:2px solid var(--orchid);padding-bottom:6px}

.item,.s-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item.on{border-color:var(--orchid)}
.info{flex:1;min-width:0}
.nome{font-weight:600;font-size:.95rem;line-height:1.2}
.bloco-preco{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.preco-de{font-size:.8rem;color:var(--err);text-decoration:line-through;font-weight:600}
.preco-por{font-size:1rem;color:var(--ok);font-weight:700}
.preco-normal{font-size:.9rem;color:var(--muted);font-weight:600;margin-top:4px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer;touch-action:manipulation}
.qty input{width:52px;height:36px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.s-q{min-width:28px;text-align:center;font-weight:700}
.rem{background:none;border:0;color:var(--err);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:8px 4px}

/* NOVO ESTILO DO RODAPÉ (INCLUINDO BARRA DE PROGRESSO) */
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:200; display: flex; flex-direction: column;}
.meta-box{background:var(--bg);padding:10px 20px;text-align:center;font-size:.85rem; border-bottom:1px solid var(--line);}
.meta-texto{font-weight:600;color:var(--plum);margin-bottom:6px}
.meta-ok{color:var(--ok);font-size:.95rem;}
.meta-barra-bg{height:8px;background:var(--line);border-radius:4px;overflow:hidden;max-width:720px;margin:0 auto;}
.meta-barra-fill{height:100%;width:0%;transition:width .4s ease, background .4s ease;}
.bar-container{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));}

.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px}
.tot{flex:1;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer}
.tot:disabled{cursor:default}
.tot small{display:block;color:var(--orchid);font-weight:600;margin-bottom:2px}
.tot b{font-size:1.2rem}
.principal{background:var(--plum);color:var(--bg);border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer}
.principal:disabled{opacity:.4;cursor:not-allowed}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;max-height:85vh;display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;z-index:300;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sheet-head h3{margin:0;color:var(--plum)}
#fechar{background:none;border:0;font-size:1.4rem;color:var(--ink);cursor:pointer;padding:6px 10px}
#sheetBody{overflow-y:auto;padding:8px 20px;flex:1}
.sheet-foot{display:flex;align-items:center;gap:16px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.sheet-foot>div{flex:1}.sheet-foot small{display:block;color:var(--muted)}.sheet-foot b{font-size:1.2rem}
#sMsg{padding:0 20px 8px;font-weight:600}
.ok{color:var(--ok)}.err{color:var(--err)}

#sucesso{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:3rem;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
#sucesso h2{margin:0 0 8px;color:var(--plum);font-size:1.6rem}
#sucesso p{margin:4px 0;color:var(--muted);max-width:340px}
#sucesso .principal{margin-top:28px}
#loading{text-align:center;padding:40px;color:var(--muted)}
</style>
</head>
<body>
<header id="topo">
  <h1>Pedido do curso</h1>
  <p class="who" id="quem"></p>
</header>
<main id="lista"><div id="loading">Carregando catálogo de produtos...</div></main>

<footer id="rodape">
  <!-- BARRA DE PROGRESSO DO ESTÁGIO -->
  <div id="metaContainer" class="meta-box" hidden>
      <div class="meta-texto" id="metaTexto"></div>
      <div class="meta-barra-bg"><div class="meta-barra-fill" id="metaFill"></div></div>
  </div>
  
  <div class="bar-container">
      <div class="bar">
        <button class="tot" id="verItens" disabled aria-label="Ver itens do pedido">
          <small id="qtd">0 itens</small><b id="total">R$ 0,00</b>
        </button>
        <button class="principal" id="enviar" disabled>Revisar pedido</button>
      </div>
  </div>
</footer>

<div id="overlay" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Itens do pedido" hidden>
  <div class="sheet-head"><h3>Seu pedido</h3><button id="fechar" aria-label="Fechar">✕</button></div>
  <div id="sheetBody"></div>
  <div id="sMsg" role="status"></div>
  <div class="sheet-foot">
    <div><small id="sQtd"></small><b id="sTotal"></b></div>
    <button class="principal" id="confirmar">Confirmar e enviar</button>
  </div>
</section>

<section id="sucesso" hidden>
  <div class="check" aria-hidden="true">✓</div>
  <h2>Pedido enviado com sucesso!</h2>
  <p id="okResumo"></p>
  <p>Recebemos o seu pedido. Em breve o vendedor responsável entrará em contato.</p>
  <button class="principal" id="novo">Fazer um novo pedido</button>
</section>

<script>
// ============================================
// CONFIGURAÇÕES GERAIS
// ============================================
const URL_BUSCAR_PRODUTOS = "https://n8n-pmua.srv1793031.hstgr.cloud/webhook/produtos-curso";
const URL_ENVIAR_PEDIDO   = "https://n8n-pmua.srv1793031.hstgr.cloud/webhook/receber-pedido-curso";

// CONFIGURAÇÃO DO PRÊMIO / META DE VENDAS
const META_ATIVA  = true; // Mude para false para esconder a barra
const META_VALOR  = 3000.00; // Valor que a cliente precisa atingir
const META_PREMIO = "Estágio Bonificado"; // Nome do prêmio
// ============================================

let PRODUTOS = [];
let MARCA_ATUAL = null;
let enviando = false;

const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const cliente  = q.get("cliente");
const vendedor = q.get("vendedor");
const curso    = q.get("curso") || "CURSO";
const nome     = q.get("nome");
const linkOk   = !!cliente && !!vendedor;
const brl = v => Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// SISTEMA DE SALVAMENTO NO CELULAR (Local Storage)
const chaveCarrinho = "carrinho_curso_" + (cliente || "teste");
let qtds = {};
try { const salvo = localStorage.getItem(chaveCarrinho); if (salvo) qtds = JSON.parse(salvo); } catch(e){}

$("quem").textContent = !cliente ? "Atenção: Falta o código do cliente no link."
  : !vendedor ? "Atenção: Falta o código do vendedor no link."
  : "Pedido para: " + (nome || "cliente " + cliente);

/* ---------- carrinho e meta ---------- */
function totais(){
  let n = 0, t = 0;
  PRODUTOS.forEach(p => { const k = qtds[p.id_produto] || 0; n += k; t += k * p.preco; });
  return {n, t};
}

function resumo(){
  const {n, t} = totais();
  $("qtd").textContent = n + (n === 1 ? " item" : " itens") + (n ? " · ver detalhes ▲" : "");
  $("total").textContent = brl(t);
  $("enviar").disabled = !linkOk || n === 0;
  $("verItens").disabled = n === 0;
  
  if (n === 0 && !$("sheet").hidden) fecharSheet();

  // ATUALIZA A BARRA DE META
  if (META_ATIVA) {
      $("metaContainer").hidden = false;
      let falta = META_VALOR - t;
      let pct = (t / META_VALOR) * 100;
      if (pct > 100) pct = 100;
      
      $("metaFill").style.width = pct + "%";
      
      if (t >= META_VALOR) {
          $("metaTexto").innerHTML = `<span class="meta-ok">🎉 Meta atingida! Você garantiu o ${META_PREMIO}!</span>`;
          $("metaFill").style.background = "var(--ok)";
      } else {
          $("metaTexto").innerHTML = `Faltam <b>${brl(falta)}</b> para ganhar: ${META_PREMIO}`;
          $("metaFill").style.background = "var(--orchid)";
      }
  }
}

function setQtd(id, v){
  v = Math.max(0, Math.min(999, parseInt(v) || 0));
  qtds[id] = v;
  // Salva no navegador da cliente
  try { localStorage.setItem(chaveCarrinho, JSON.stringify(qtds)); } catch(e){}

  const el = $("i" + id);
  if (el) { el.querySelector("input").value = v; el.classList.toggle("on", v > 0); }
  resumo();
  if (!$("sheet").hidden) renderSheet();
}

/* ---------- janela "Revisar pedido" ---------- */
function abrirSheet(){ $("sMsg").textContent = ""; $("confirmar").disabled = false; $("sheet").hidden = false; $("overlay").hidden = false; renderSheet(); }
function fecharSheet(){ $("sheet").hidden = true; $("overlay").hidden = true; }

function renderSheet(){
  const body = $("sheetBody");
  body.innerHTML = "";
  PRODUTOS.filter(p => qtds[p.id_produto] > 0)
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", {numeric: true}))
    .forEach(p => {
      const k = qtds[p.id_produto];
      const row = document.createElement("div");
      row.className = "s-item";
      row.innerHTML = `<div class="info"><div class="nome">${esc(p.nome)}</div>
        <div class="preco-normal">${k} × ${brl(p.preco)} = <b>${brl(k * p.preco)}</b></div></div>
        <div class="qty"><button data-d="-1" aria-label="Diminuir">−</button><span class="s-q">${k}</span><button data-d="1" aria-label="Aumentar">+</button></div>
        <button class="rem" aria-label="Remover">🗑️</button>`;
      row.querySelectorAll(".qty button").forEach(b => b.onclick = () => setQtd(p.id_produto, (qtds[p.id_produto] || 0) + +b.dataset.d));
      row.querySelector(".rem").onclick = () => setQtd(p.id_produto, 0);
      body.appendChild(row);
    });
  const {n, t} = totais();
  $("sQtd").textContent = n + (n === 1 ? " item" : " itens");
  $("sTotal").textContent = brl(t);
}

/* ---------- envio e tela de sucesso ---------- */
async function enviarPedido(){
  if (enviando) return;
  const itens = PRODUTOS.filter(p => qtds[p.id_produto] > 0)
    .map(p => ({id_produto: p.id_produto, quantidade: qtds[p.id_produto], preco: p.preco}));
  if (!itens.length) return;
  
  enviando = true;
  $("confirmar").disabled = true;
  $("sMsg").className = ""; $("sMsg").textContent = "Lançando pedido no sistema...";
  
  try {
    const r = await fetch(URL_ENVIAR_PEDIDO, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({curso, id_cliente: cliente, id_vendedor: vendedor, itens})
    });
    if (!r.ok) throw new Error(r.status);
    
    // Apaga a memória porque o pedido já foi enviado
    try { localStorage.removeItem(chaveCarrinho); } catch(e){}
    mostrarSucesso();
  } catch (e) {
    $("sMsg").className = "err"; $("sMsg").textContent = "Erro ao enviar. Verifique a internet e tente de novo.";
    $("confirmar").disabled = false;
  } finally { enviando = false; }
}

function mostrarSucesso(){
  const {n, t} = totais();
  $("okResumo").textContent = n + (n === 1 ? " item" : " itens") + " · " + brl(t);
  fecharSheet();
  ["topo", "lista", "rodape"].forEach(id => $(id).hidden = true);
  $("sucesso").hidden = false;
  window.scrollTo(0, 0);
}

$("novo").onclick = () => {
  Object.keys(qtds).forEach(k => delete qtds[k]);
  try { localStorage.removeItem(chaveCarrinho); } catch(e){}
  MARCA_ATUAL = null;
  ["topo", "lista", "rodape"].forEach(id => $(id).hidden = false);
  $("sucesso").hidden = true;
  montarTela(); resumo();
};

$("verItens").onclick = abrirSheet;
$("enviar").onclick = abrirSheet;
$("confirmar").onclick = enviarPedido;
$("fechar").onclick = fecharSheet;
$("overlay").onclick = fecharSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) fecharSheet(); });

/* ---------- catálogo e limpeza de dados ---------- */
async function carregarProdutos(){
  try {
    const resposta = await fetch(URL_BUSCAR_PRODUTOS);
    const listaSuja = await resposta.json();
    
    // FILTRO: Tira material de apoio e itens indisponíveis
    PRODUTOS = listaSuja.filter(p => {
        const n = (p.nome || "").toLowerCase();
        const m = (p.marca || "").toLowerCase();
        const c = (p.categoria || "").toLowerCase();
        
        const isIndisponivel = n.includes("indisponivel") || n.includes("indisponível");
        const isApoio = m === "material apoio" || m === "material de apoio" || c === "material apoio" || c === "material de apoio";
        
        return !isIndisponivel && !isApoio;
    });

    montarTela();
  } catch (e) {
    $("lista").innerHTML = "<div id='loading'>Erro ao carregar os produtos.</div>";
  }
}

function montarTela(){
  const lista = $("lista");
  lista.innerHTML = "";
  if (MARCA_ATUAL === null) desenharTelaDeMarcas(lista);
  else desenharTelaDeProdutos(lista, MARCA_ATUAL);
}

function desenharTelaDeMarcas(container){
  let marcas = [...new Set(PRODUTOS.map(p => p.marca).filter(Boolean))]
    .filter(m => !["ingresso", "estágio", "estagio"].includes(m.toLowerCase()));

  const sh = document.createElement("div");
  sh.className = "sticky-header";
  sh.innerHTML = "<h2>Escolha uma Marca</h2>";
  container.appendChild(sh);

  const grid = document.createElement("div");
  grid.className = "grid-opcoes";
  marcas.forEach(marca => {
    const qm = PRODUTOS.filter(p => p.marca === marca && qtds[p.id_produto] > 0).reduce((acc, p) => acc + qtds[p.id_produto], 0);
    const card = document.createElement("div");
    card.className = "card-opcao";
    card.innerHTML = `<div class="card-titulo">${esc(marca)}</div>` +
      (qm ? `<div class="badge">${qm} na sacola</div>` : "");
    card.onclick = () => { MARCA_ATUAL = marca; montarTela(); window.scrollTo(0, 0); };
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function desenharTelaDeProdutos(container, marca){
  const sh = document.createElement("div");
  sh.className = "sticky-header";

  const btnVoltar = document.createElement("button");
  btnVoltar.className = "btn-voltar";
  btnVoltar.textContent = "← Voltar para Marcas";
  btnVoltar.onclick = () => { MARCA_ATUAL = null; montarTela(); };
  sh.appendChild(btnVoltar);

  const hMarca = document.createElement("h2");
  hMarca.textContent = `Catálogo: ${marca}`;
  sh.appendChild(hMarca);

  const searchInput = document.createElement("input");
  searchInput.type = "search";
  searchInput.className = "search-box";
  searchInput.placeholder = "Buscar nome (ex: 6.4)...";
  sh.appendChild(searchInput);
  container.appendChild(sh);

  const produtosDaMarca = PRODUTOS.filter(p => p.marca === marca);
  produtosDaMarca.sort((a, b) => {
    const numA = parseFloat(a.nome.match(/^[\/\d\.]+/)?.[0]);
    const numB = parseFloat(b.nome.match(/^[\/\d\.]+/)?.[0]);
    if (!isNaN(numA) && !isNaN(numB)) {
      if (numA !== numB) return numA - numB;
      return a.nome.localeCompare(b.nome);
    }
    return a.nome.localeCompare(b.nome, "pt-BR", {numeric: true});
  });

  const categorias = [...new Set(produtosDaMarca.map(p => p.categoria).filter(Boolean))];
  categorias.sort((a, b) => {
    if (a.toLowerCase() === "combo") return -1;
    if (b.toLowerCase() === "combo") return 1;
    return a.localeCompare(b);
  });

  categorias.forEach(cat => {
    const bloco = document.createElement("div");
    bloco.className = "categoria-bloco";
    bloco.innerHTML = `<div class="categoria-titulo">${esc(cat)}</div>`;

    produtosDaMarca.filter(p => p.categoria === cat).forEach(p => {
      const htmlPreco = (p.preco_de && p.preco_de > p.preco)
        ? `<div class="bloco-preco"><span class="preco-de">DE ${brl(p.preco_de)}</span> <span class="preco-por">POR ${brl(p.preco)}</span></div>`
        : `<div class="bloco-preco"><span class="preco-normal">${brl(p.preco)}</span></div>`;

      const v = qtds[p.id_produto] || 0;
      const el = document.createElement("div");
      el.className = "item" + (v > 0 ? " on" : "");
      el.id = "i" + p.id_produto;
      el.innerHTML = `<div class="info"><div class="nome">${esc(p.nome)}</div>${htmlPreco}</div>
        <div class="qty">
          <button aria-label="Diminuir" data-d="-1">−</button>
          <input type="number" inputmode="numeric" min="0" max="999" value="${v}" aria-label="Quantidade">
          <button aria-label="Aumentar" data-d="1">+</button>
        </div>`;
      const inp = el.querySelector("input");
      el.querySelectorAll("button").forEach(b => b.onclick = () => setQtd(p.id_produto, (qtds[p.id_produto] || 0) + +b.dataset.d));
      inp.onchange = () => setQtd(p.id_produto, inp.value);
      bloco.appendChild(el);
    });
    container.appendChild(bloco);
  });

  searchInput.addEventListener("input", e => {
    const termo = e.target.value.toLowerCase();
    container.querySelectorAll(".categoria-bloco").forEach(bloco => {
      let vis = false;
      bloco.querySelectorAll(".item").forEach(item => {
        const ok = item.querySelector(".nome").textContent.toLowerCase().includes(termo);
        item.style.display = ok ? "flex" : "none";
        if (ok) vis = true;
      });
      bloco.style.display = vis ? "block" : "none";
    });
  });
}

carregarProdutos();
resumo();
</script>
</body>
</html>
